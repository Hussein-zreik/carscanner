# Builds CR-V Diag on every push to the working branch, runs the unit tests, and publishes the
# APK as a GitHub Release so it can be downloaded straight onto the tablet (Releases page).
name: Build APK and release

on:
  push:
    branches: ["claude/new-session-5tqeuh", "main"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages (platform 37, build-tools 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null || true

      - name: Unit tests, lint and debug APK
        run: ./gradlew test lintDebug assembleDebug --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          APK="crv-diag-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          {
            echo "CR-V Diag ${VERSION}, build ${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7})."
            echo
            echo "Latest change: $(git log -1 --pretty=%s)"
            echo
            echo "Install on the tablet: tap the .apk below, then Install. It installs over older"
            echo "versions (same signing key), keeping your data. Unit tests passed in this build;"
            echo "car verification is tracked in CLAUDE.md."
          } > notes.txt
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
            --title "CR-V Diag ${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes-file notes.txt --latest

      - name: Keep test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/"
          retention-days: 7
